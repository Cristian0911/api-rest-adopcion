spring.application.name=API-REST-AdopcionCodigoFacilito
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Flyway solo se usa en el perfil postgres; en H2 el esquema lo genera Hibernate y data.sql carga los tipos
spring.flyway.enabled=false

# Sin valores por defecto: fuera del perfil dev deben venir de variables de entorno
app.security.user.name=${APP_USER_NAME:}
app.security.user.password=${APP_USER_PASSWORD:}
app.security.admin.name=${APP_ADMIN_NAME:}
app.security.admin.password=${APP_ADMIN_PASSWORD:}

# OpenAPI / Swagger UI: solo se documentan los endpoints de negocio
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Actuator: solo health e info por HTTP, sin detalles internos
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
management.info.env.enabled=true

# Datos públicos de /actuator/info. Nombre y versión se toman del pom.xml al compilar.
# Spring Boot lee este archivo como ISO-8859-1: los caracteres no ASCII van escapados.
info.app.name=@project.name@
info.app.description=API REST para la adopci\u00f3n de mascotas
info.app.version=@project.version@
