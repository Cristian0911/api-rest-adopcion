# Perfil PostgreSQL (local o Supabase). Todos los datos de conexión vienen de variables de entorno.
# Ejemplo de DB_URL para el pooler de Supabase en modo session (copiar host, puerto y usuario del panel):
#   jdbc:postgresql://<host-del-pooler>:5432/postgres?sslmode=verify-full&sslrootcert=<ruta-al-certificado-CA>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# PostgreSQL espera un bloqueo de forma indefinida; se limita la espera de SELECT ... FOR UPDATE.
# Es un ajuste de sesión: requiere conexión directa o pooler en modo session (no en modo transaction).
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '${DB_LOCK_TIMEOUT:5s}'

# El esquema lo crean las migraciones de Flyway; Hibernate solo valida que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=adopcion
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.default-schema=adopcion
spring.flyway.schemas=adopcion
spring.flyway.locations=classpath:db/migration/postgresql
