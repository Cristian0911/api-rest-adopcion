# Nombre fijo para poder conectarse desde la consola H2
spring.datasource.url=jdbc:h2:mem:adopciondb
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Credenciales de demostración solo para desarrollo local; se reemplazan con variables de entorno
app.security.user.name=${APP_USER_NAME:user}
app.security.user.password=${APP_USER_PASSWORD:user123}
app.security.admin.name=${APP_ADMIN_NAME:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:admin123}
